[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[dev]
  # Sirve dist/ (tienda + panel compilados) en vez de arrancar Vite,
  # para probar la web y la API en el mismo origen.
  framework = "#static"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# El panel es una SPA: cualquier ruta de /admin vuelve a su index.
# Los archivos estáticos de /admin/assets tienen prioridad sobre esta regla.
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
